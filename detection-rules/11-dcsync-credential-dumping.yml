name: "APT29 - DCSync Credential Dumping"
language: KQL
risk_score: 99
mitre_attack:
  - T1003.006
schedule:
  interval: "1m"
  lookback: "5m"
query: |
  event.code: "4662" and winlog.event_data.Properties: (*1131f6aa* or *1131f6ad* or
  *89e95b76*) and winlog.event_data.AccessMask: "0x100" and
  not winlog.event_data.SubjectUserName: (*$)
description: >
  Detects DCSync attacks by monitoring Security Event ID 4662 for access to Active Directory replication GUIDs (DS-Replication-Get-Changes), indicating an attempt to extract credential material including the krbtgt hash for Golden Ticket forgery.
known_false_positives: >
  Domain Controllers legitimately replicate directory data between each other; the rule excludes computer accounts (trailing $). Any non-DC account triggering this rule should be treated as a critical incident.
source: "APT29_LOTL_Final_Report1 - Appendix B"
