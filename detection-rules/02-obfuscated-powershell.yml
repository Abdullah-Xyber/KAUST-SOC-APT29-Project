name: "APT29 - Obfuscated PowerShell Execution"
language: KQL
risk_score: 73
mitre_attack:
  - T1059.001
  - T1027
schedule:
  interval: "1m"
  lookback: "5m"
query: |
  event.code: "1" and (process.name: "powershell.exe" or process.command_line: *powershell*) and
  (process.command_line: *-EncodedCommand* or *-enc* or *-e * or *frombase64string* or
  *-nop* or *-bypass* or *-windowstyle hidden* or *-w hidden* or *invoke-expression*)
description: >
  Detects obfuscated or encoded PowerShell commands commonly used by APT29 for initial execution and defense evasion.
known_false_positives: >
  Legitimate administrative PowerShell scripts using encoding for automation purposes.
source: "APT29_LOTL_Final_Report1 - Appendix B"
