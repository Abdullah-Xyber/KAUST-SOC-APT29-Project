name: "APT29 - Explicit Credential Object Creation"
language: KQL
risk_score: 73
mitre_attack:
  - T1550.002
  - T1021.006
schedule:
  interval: "1m"
  lookback: "5m"
query: |
  event.code: "4104" and
  (powershell.file.script_block_text: *New-Object System.Management.Automation.PSCredential* or
  powershell.file.script_block_text: *ConvertTo-SecureString*) and
  powershell.file.script_block_text: *Invoke-Command*
description: >
  Detects PowerShell scripts that explicitly construct credential objects using PSCredential and ConvertTo-SecureString in combination with Invoke-Command, indicating credential-based lateral movement over WinRM. This pattern is characteristic of APT29 tradecraft where stolen or known credentials are used programmatically to authenticate to remote systems without interactive logon.
known_false_positives: >
  Legitimate administrative automation scripts may construct PSCredential objects for remote-management tasks such as software deployment or configuration management.
source: "APT29_LOTL_Final_Report1 - Appendix B"
